name: CI Backend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Pytest & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --dev --python 3.12

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,node_modules,migrations
          # Treat remaining issues as non-blocking warnings
          uvx flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,node_modules,migrations

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: "config.settings.test"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-only"
          USE_DOCKER: "no"
        run: uv run pytest