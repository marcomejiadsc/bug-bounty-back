services:
  docs:
    image: bug_bounty_tracker_local_docs
    container_name: bug_bounty_tracker_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./bug_bounty_tracker:/app/bug_bounty_tracker:z
    ports:
      - '9000:9000'
    command: /start-docs
